        const formatToBRDate = (dateVal) => {
            if (!dateVal) return "—";
            try {
                const s = String(dateVal).trim();
                // Pure date string YYYY-MM-DD — parse as local to avoid UTC midnight shift
                if (/^\d{4}-\d{2}-\d{2}$/.test(s)) {
                    const [y, mo, d] = s.split('-');
                    return `${d}/${mo}/${y}`;
                }
                // ISO with time or full date string
                const d = new Date(s);
                if (!isNaN(d.getTime())) {
                    const dd = String(d.getDate()).padStart(2, '0');
                    const mm = String(d.getMonth() + 1).padStart(2, '0');
                    const yyyy = d.getFullYear();
                    const hh = String(d.getHours()).padStart(2, '0');
                    const min = String(d.getMinutes()).padStart(2, '0');
                    const hasTime = d.getHours() !== 0 || d.getMinutes() !== 0 || d.getSeconds() !== 0;
                    return hasTime ? `${dd}/${mm}/${yyyy} - ${hh}:${min}` : `${dd}/${mm}/${yyyy}`;
                }
            } catch (e) {}
            return String(dateVal);
        };

        const getInitials = (name) => {
            if (!name) return "LB";
            const parts = name.trim().split(/\s+/).filter(Boolean);
            if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
            return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
        };

        const getDaysSinceInteraction = (contact) => {
            const hist = contact.historico || [];
            if (hist.length === 0) {
                // Use creation date
                const base = contact.criado || contact.updated_at;
                if (!base) return null;
                const days = Math.floor((Date.now() - new Date(base)) / 86400000);
                return days;
            }
            // Find last interaction date
            const lastDate = hist.reduce((latest, h) => {
                const d = new Date(h.data);
                return d > latest ? d : latest;
            }, new Date(0));
            const days = Math.floor((Date.now() - lastDate) / 86400000);
            return days;
        };

            if (clean.length <= 2) {

            }
            if (clean.length <= 6) {
                return `(${clean.slice(0, 2)}) ${clean.slice(2)}`;
            }
            if (clean.length <= 10) {
                return `(${clean.slice(0, 2)}) ${clean.slice(2, 6)}-${clean.slice(6)}`;
            }
            return `(${clean.slice(0, 2)}) ${clean.slice(2, 7)}-${clean.slice(7, 11)}`;

                    const timer = setTimeout(() => {
                        delete window[callbackName];
                        script.remove();
                        reject(new Error('URL de sincronização do Script offline ou ocupado.'));
                    }, 12000);

                    window[callbackName] = (data) => {
                        clearTimeout(timer);
                        delete window[callbackName];
                        script.remove();
                        resolve(data);
                    };

                    const sp = new URLSearchParams({ ...params, callback: callbackName });
                    const script = document.createElement('script');
                    script.src = `${url}?${sp.toString()}`;
                    script.onerror = () => {
                        clearTimeout(timer);
                        delete window[callbackName];
                        script.remove();
                        reject(new Error('Falha de script. Verifique as credenciais.'));
                    };
                    document.head.appendChild(script);

                                    <div class="sm:col-span-2">
                                        <label class="text-[9px] font-bold text-outline block mb-1 uppercase tracking-wider">Endereço de Encaminhamento</label>
                                        <input type="text" value={ncData.endereco} onChange={e => setNcData({ ...ncData, endereco: e.target.value })} placeholder="Consultório de encaminhamento parceiro ou endereço residencial" class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl" />
                                    </div>
                                    <div class="sm:col-span-2">
                                        <label class="text-[9px] font-bold text-outline block mb-1 uppercase tracking-wider">Anotações Clínicas & Notas</label>
                                        <textarea value={ncData.obs} onChange={e => setNcData({ ...ncData, obs: e.target.value })} placeholder="Especialidades indicadas pelo médico parceiro, planos corporativos, limitações motoras..." class="w-full bg-slate-50 border border-slate-200 p-2.5 rounded-xl h-20 resize-none"></textarea>
                                    </div>
                                </div>

                                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                                    <button id="cancel-contact-registration" type="button" onClick={() => setIsContactModalOpen(false)} class="px-5 py-2.5 border border-slate-200 rounded-xl hover:bg-slate-50 font-bold">Cancelar</button>
                                    <button id="submit-contact-btn" type="submit" class="bg-deep-forest text-white px-5 py-2.5 font-bold rounded-xl shadow-md hover:bg-opacity-90">Salvar Cadastro</button>
                                </div>
                            </form>
                        </div>
                    )}

                    {/* MANUAL REGISTRATION MODAL: SERVICE CATALOGUE */}
                    {isServiceModalOpen && (
                        <div id="service-modal-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-[990] flex items-center justify-center p-4">
                            <form id="service-creation-form" onSubmit={handleSaveService} class="bg-white border border-slate-200 rounded-3xl w-full max-w-sm p-6 shadow-xl space-y-4 text-xs font-semibold">
                                <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                                    <h3 class="font-display font-bold text-deep-forest text-sm">{nsData.id ? 'Editar Serviço Clínico' : 'Cadastrar Serviço Clínico'}</h3>
                                    <button id="close-service-creation-modal" type="button" onClick={() => setIsServiceModalOpen(false)}>
                                        <Icon name="x" />
                                    </button>
                                </div>

                                <div class="space-y-1 text-xs">
                                    <label class="text-[11px] font-bold text-outline uppercase tracking-wider">Nome da Especialidade / Serviço</label>
                                    <input 
                                        id="service-name-input"
                                        required 
                                        type="text" 
                                        value={nsData.nome} 
                                        onChange={e => setNsData({ ...nsData, nome: e.target.value })} 
                                        placeholder="Ex. RPG, Pilates, Acupuntura, Fisioterapia..." 
                                        class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:outline-none font-medium text-[#0b1c30]" 
                                    />
                                </div>

                                <div class="flex justify-end gap-2.5 pt-4 border-t border-slate-100">
                                    <button id="cancel-service-submit" type="button" onClick={() => setIsServiceModalOpen(false)} class="px-4 py-2 font-bold border border-slate-200 rounded-xl hover:bg-slate-50">Cancelar</button>
                                    <button id="submit-service-btn" type="submit" class="px-4 py-2 bg-deep-forest hover:bg-opacity-90 text-white font-bold rounded-xl shadow-md">Salvar</button>
                                </div>
                            </form>
                        </div>
                    )}

                </div>
            );
        }

        // Mount the standalone interactive app on index wrapper
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CRMStandaloneApp />);
    </script>
</body>
</html>
