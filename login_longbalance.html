<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LongBalance — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #28c98a;
  --accent2: #6c63f5;
  --accent3: #3da8e8;
  --bg: #0d1117;
  --surface: #161c27;
  --card: #1c2333;
  --border: #262f42;
  --text: #e6edf3;
  --muted: #7d8fa8;
  --sub: #3a4a5e;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}

/* ── ANIMATED BACKGROUND ── */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(40,201,138,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(40,201,138,.04) 1px, transparent 1px);
  background-size: 40px 40px;
  animation: grid-drift 20s linear infinite;
  pointer-events: none;
}
@keyframes grid-drift {
  from { transform: translate(0,0); }
  to   { transform: translate(40px, 40px); }
}

.bg-glow {
  position: fixed;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  animation: glow-pulse 6s ease-in-out infinite alternate;
}
.bg-glow.g1 {
  background: radial-gradient(circle, rgba(40,201,138,.12) 0%, transparent 70%);
  top: -150px; left: -150px;
}
.bg-glow.g2 {
  background: radial-gradient(circle, rgba(108,99,245,.08) 0%, transparent 70%);
  bottom: -150px; right: -150px;
  animation-delay: -3s;
}
@keyframes glow-pulse {
  from { opacity: .6; transform: scale(1); }
  to   { opacity: 1;  transform: scale(1.15); }
}

/* ── PARTICLES ── */
.particles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
  animation: float-up var(--dur, 8s) var(--delay, 0s) ease-in infinite;
}
@keyframes float-up {
  0%   { opacity: 0; transform: translateY(0) scale(1); }
  10%  { opacity: .6; }
  90%  { opacity: .2; }
  100% { opacity: 0; transform: translateY(-100vh) scale(0); }
}

/* ── MAIN CARD ── */
.login-wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 420px;
  padding: 20px;
  animation: card-in .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes card-in {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.login-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 40px 36px 36px;
  box-shadow:
    0 0 0 1px rgba(40,201,138,.06),
    0 24px 64px rgba(0,0,0,.5),
    0 4px 16px rgba(0,0,0,.3);
  position: relative;
  overflow: hidden;
}

/* top accent line */
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
  opacity: .8;
}

/* ── LOGO ── */
.logo-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 28px;
}
.logo-mark {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  box-shadow: 0 4px 14px rgba(40,201,138,.3);
  flex-shrink: 0;
  position: relative;
}
.logo-mark::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
}
.logo-text {
  display: flex;
  flex-direction: column;
}
.logo-name {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: -.3px;
  line-height: 1;
}
.logo-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 500;
  margin-top: 3px;
  letter-spacing: .3px;
  text-transform: uppercase;
}

/* ── HEADING ── */
.login-heading {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
  letter-spacing: -.4px;
}
.login-sub {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 28px;
}

/* ── ALERT (401) ── */
.alert-401 {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border-radius: 10px;
  background: rgba(232,82,106,.1);
  border: 1px solid rgba(232,82,106,.25);
  margin-bottom: 18px;
  font-size: 12px;
  color: #e8526a;
  animation: shake .3s ease;
}
.alert-401.show { display: flex; }
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%,60%  { transform: translateX(-5px); }
  40%,80%  { transform: translateX(5px); }
}

/* ── FORM ── */
.form-group {
  margin-bottom: 16px;
}
.form-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .6px;
  margin-bottom: 7px;
}
.input-wrap {
  position: relative;
}
.input-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  pointer-events: none;
  opacity: .5;
}
.form-input {
  width: 100%;
  padding: 11px 13px 11px 40px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.form-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(40,201,138,.12);
}
.form-input::placeholder { color: var(--sub); }

.pw-toggle {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 16px;
  padding: 4px;
  border-radius: 5px;
  transition: color .15s;
}
.pw-toggle:hover { color: var(--text); }

/* ── REMEMBER ── */
.remember-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 22px;
}
.custom-check {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .15s;
  flex-shrink: 0;
}
.custom-check.checked {
  background: var(--accent);
  border-color: var(--accent);
}
.custom-check .check-mark {
  font-size: 10px;
  color: #0d1117;
  font-weight: 700;
  display: none;
}
.custom-check.checked .check-mark { display: block; }
.remember-label {
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  user-select: none;
}

/* ── LOGIN BUTTON ── */
.login-btn {
  width: 100%;
  padding: 13px;
  border-radius: 11px;
  border: none;
  background: linear-gradient(135deg, var(--accent), #1fb87a);
  color: #0d1117;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: -.2px;
  transition: all .2s;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(40,201,138,.3);
}
.login-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(40,201,138,.4);
}
.login-btn:active {
  transform: translateY(0);
  box-shadow: 0 2px 8px rgba(40,201,138,.2);
}
.login-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,.15), transparent);
  pointer-events: none;
}
.login-btn.loading {
  pointer-events: none;
  opacity: .8;
}

/* ── NAV LINKS ── */
.nav-links {
  display: flex;
  gap: 8px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.nav-link {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
  font-weight: 500;
  transition: all .18s;
}
.nav-link:hover {
  border-color: var(--accent);
  color: var(--text);
  background: rgba(40,201,138,.06);
}
.nav-link .nl-icon { font-size: 15px; }
.nav-link .nl-text { display: flex; flex-direction: column; text-align: left; }
.nav-link .nl-name { font-weight: 600; color: var(--text); font-size: 12px; }
.nav-link .nl-desc { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* ── FOOTER ── */
.login-footer {
  text-align: center;
  margin-top: 20px;
  font-size: 11px;
  color: var(--sub);
}

/* ── STATUS DOTS ── */
.status-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-top: 5px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  animation: dot-pulse 2s ease-in-out infinite;
}
.status-dot:nth-child(2) { animation-delay: .3s; background: var(--accent2); }
.status-dot:nth-child(3) { animation-delay: .6s; background: var(--accent3); }
@keyframes dot-pulse {
  0%,100% { opacity: .3; transform: scale(.8); }
  50%      { opacity: 1;  transform: scale(1.2); }
}
</style>
</head>
<body>

<!-- Animated background -->
<div class="bg-grid"></div>
<div class="bg-glow g1"></div>
<div class="bg-glow g2"></div>
<div class="particles" id="particles"></div>

<div class="login-wrap">
  <div class="login-card">

    <!-- Logo -->
    <div class="logo-row">
      <div class="logo-mark">💚</div>
      <div class="logo-text">
        <span class="logo-name">LongBalance</span>
        <span class="logo-sub">Clínica de Fisioterapia</span>
      </div>
    </div>

    <!-- Heading -->
    <div class="login-heading">Bem-vindo de volta</div>
    <div class="login-sub">Entre com suas credenciais para acessar o sistema</div>

    <!-- 401 alert (shown via URL param) -->
    <div class="alert-401" id="alert401">
      <span>🔐</span>
      <span>Credenciais inválidas. Tente novamente.</span>
    </div>

    <!-- Form (triggers native HTTP Basic Auth) -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Usuário</label>
        <div class="input-wrap">
          <span class="input-icon">👤</span>
          <input
            class="form-input"
            type="text"
            id="username"
            placeholder="admin"
            autocomplete="username"
            required
          >
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Senha</label>
        <div class="input-wrap">
          <span class="input-icon">🔑</span>
          <input
            class="form-input"
            type="password"
            id="password"
            placeholder="••••••••••"
            autocomplete="current-password"
            required
          >
          <button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()" title="Mostrar/ocultar senha">
            👁
          </button>
        </div>
      </div>

      <div class="remember-row">
        <div class="custom-check" id="rememberCheck" onclick="toggleRemember()">
          <span class="check-mark">✓</span>
        </div>
        <span class="remember-label" onclick="toggleRemember()">Manter conectado</span>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Entrar no Sistema →
      </button>
    </form>

    <!-- Nav links -->
    <div class="nav-links">
      <a href="dashboard_longbalance.html" class="nav-link">
        <span class="nl-icon">📊</span>
        <span class="nl-text">
          <span class="nl-name">Dashboard</span>
          <span class="nl-desc">Métricas e visão geral</span>
        </span>
      </a>
      <a href="crm_longbalance.html" class="nav-link">
        <span class="nl-icon">👥</span>
        <span class="nl-text">
          <span class="nl-name">CRM</span>
          <span class="nl-desc">Leads e contatos</span>
        </span>
      </a>
    </div>

  </div>

  <div class="login-footer">
    Acesso protegido · LongBalance © 2025
    <div class="status-row">
      <div class="status-dot"></div>
      <div class="status-dot"></div>
      <div class="status-dot"></div>
    </div>
  </div>
</div>

<script>
// ── PARTICLES ──────────────────────────────────────────────
(function(){
  const container = document.getElementById('particles');
  const colors = ['#28c98a','#6c63f5','#3da8e8'];
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.cssText = `
      left:${Math.random()*100}%;
      bottom:${Math.random()*20}%;
      --dur:${6+Math.random()*10}s;
      --delay:${Math.random()*8}s;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      width:${1+Math.random()*2}px;
      height:${1+Math.random()*2}px;
      opacity:0;
    `;
    container.appendChild(p);
  }
})();

// ── CREDENCIAIS ───────────────────────────────────────────
// Para adicionar usuários: 'usuario': 'senha'
const USERS = {
  'admin': '@longbalance@2026',
  'cezar': '@longbalance@2026',
  'atendimento': '@longbalance@2026',
};

function setCookie(name, val, days){
  const exp = new Date(Date.now() + days*864e5).toUTCString();
  document.cookie = `${name}=${val};expires=${exp};path=/;SameSite=Strict`;
}

// ── SHOW ERROR ALERT if redirected ────────────────────────
(function(){
  const p = new URLSearchParams(window.location.search);
  if(p.get('err')==='1'){
    document.getElementById('alert401').classList.add('show');
  }
  // If already logged in, redirect
  if(document.cookie.includes('lb_auth=ok')){
    const target = sessionStorage.getItem('lb_redirect') || 'dashboard_longbalance.html';
    window.location.href = target;
  }
})();

// ── TOGGLE PASSWORD VISIBILITY ─────────────────────────────
function togglePw(){
  const inp = document.getElementById('password');
  const btn = document.getElementById('pwToggle');
  if(inp.type==='password'){
    inp.type='text';
    btn.textContent='🙈';
  } else {
    inp.type='password';
    btn.textContent='👁';
  }
}

// ── TOGGLE REMEMBER ────────────────────────────────────────
let rememberChecked = false;
function toggleRemember(){
  rememberChecked = !rememberChecked;
  document.getElementById('rememberCheck').classList.toggle('checked', rememberChecked);
}

// ── LOGIN HANDLER ──────────────────────────────────────────
function handleLogin(e){
  e.preventDefault();
  const btn      = document.getElementById('loginBtn');
  const user     = document.getElementById('username').value.trim();
  const pass     = document.getElementById('password').value;
  const alert401 = document.getElementById('alert401');

  btn.textContent = '⏳ Verificando...';
  btn.classList.add('loading');
  alert401.classList.remove('show');

  const days = rememberChecked ? 30 : 1;

  if(USERS[user] && pass === USERS[user]){
    setCookie('lb_auth', 'ok', days);
    if(rememberChecked){
      try{ localStorage.setItem('lb_auth_user', user); }catch(ex){}
    }
    btn.textContent = '✅ Redirecionando...';
    const target = sessionStorage.getItem('lb_redirect') || 'dashboard_longbalance.html';
    window.location.href = target;
  } else {
    btn.textContent = 'Entrar no Sistema →';
    btn.classList.remove('loading');
    alert401.classList.add('show');
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}

// ── PRE-FILL SAVED USERNAME ────────────────────────────────
(function(){
  try{
    const u = localStorage.getItem('lb_auth_user');
    if(u){ document.getElementById('username').value = u; }
  }catch(e){}
})();
</script>
</body>
</html>
